server:
  port: 8080

campus:
  # 允许跨域的前端地址，多个用逗号分隔
  cors-origins: http://localhost:5173,http://localhost:3000

spring:
  application:
    name: campus-trading
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_trading?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

file:
  # 文件上传目录，基于启动目录(user.dir)解析，默认在 backend 目录下启动
  # 如需自定义，改为绝对路径即可（例如 D:/uploads/）
  upload-dir: ${user.dir}/uploads/

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) %clr([%thread]){faint} %clr(%logger{36}){cyan} %clr(:){faint} %msg%n"
